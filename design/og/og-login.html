<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #020A12;
    background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 56px 56px;
    color: #F5F7FA;
    font-family: Inter, sans-serif;
    position: relative;
  }
  .wrap { position: relative; height: 100%; padding: 64px 72px; display: flex; flex-direction: column; justify-content: space-between; }
  .top { font-family: 'JetBrains Mono', monospace; font-size: 15px; letter-spacing: .16em; color: #91A4B4; }
  .mid { display: flex; align-items: center; gap: 44px; }
  .mid .cap { font-family: 'Space Grotesk', sans-serif; font-size: 22px; letter-spacing: .62em; margin-right: -.62em; color: #91A4B4; text-align: right; margin-bottom: 14px; }
  .mid .word { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 76px; letter-spacing: .22em; line-height: 1; }
  .panel { margin-top: 44px; }
  .tag { font-family: 'JetBrains Mono', monospace; font-size: 16px; letter-spacing: .16em; color: #52FF9D; margin-bottom: 16px; }
  h1 { font-family: 'Space Grotesk', sans-serif; font-weight: 500; font-size: 58px; letter-spacing: -.02em; line-height: 1.05; }
  .sub { font-size: 22px; color: #91A4B4; margin-top: 16px; }
  .bottom { display: flex; align-items: center; gap: 14px; font-family: 'JetBrains Mono', monospace; font-size: 14px; letter-spacing: .12em; color: #5E7282; }
  .bottom i { width: 9px; height: 9px; border-radius: 50%; background: #52FF9D; box-shadow: 0 0 12px rgba(82,255,157,.8); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="top">PLATAFORMA MAZARI</div>
    <div>
      <div class="mid">
        <svg width="150" height="140" viewBox="0 0 60 56" style="overflow:visible"><polyline points="6,52 6,8 30,30 54,8 54,52" fill="none" stroke="#F5F7FA" stroke-width="7"></polyline><rect x="26" y="40" width="8" height="12" fill="#52FF9D"></rect></svg>
        <div>
          <div class="cap">CAPITAL</div>
          <div class="word">MAZARI</div>
        </div>
      </div>
      <div class="panel">
        <div class="tag">ACESSO SEGURO</div>
        <h1>Entrar na plataforma</h1>
        <div class="sub">Operações, documentos e resultados em um único ambiente.</div>
      </div>
    </div>
    <div class="bottom"><i></i>CONEXÃO CRIPTOGRAFADA · ACESSOS AUDITADOS</div>
  </div>
</body>
</html>
